name: Controlli

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: none
          tools: composer
      - name: Sintassi PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Test
        run: php tests/run.php
      - name: Test degli script Apps Script
        if: matrix.php == '8.3'
        run: node tests/apps-script.js
      - name: Regole di scrittura (phpcs)
        if: matrix.php == '8.3'
        run: |
          composer install --no-interaction --no-progress
          composer lint
